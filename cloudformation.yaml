AWSTemplateFormatVersion: '2010-09-09'
Description: TrailPack static website hosted on S3 with CloudFront

Parameters:
  DomainName:
    Type: String
    Default: trailpack.snurray.com
    Description: Custom domain name for the website

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >
      ARN of an ACM certificate in us-east-1 for HTTPS with the custom domain.
      Leave empty to use the default *.cloudfront.net domain.

  JWTSecret:
    Type: String
    Default: 'trailpack-change-me-before-prod'
    NoEcho: true
    Description: Secret key for signing JWT auth tokens. Override via JWT_SECRET GitHub secret.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref AcmCertificateArn, '']]

Resources:

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed CachingOptimized policy
          Compress: true
        Aliases: !If
          - HasCustomDomain
          - - !Ref DomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  TrailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-trails'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt UsersTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt TrailsTable.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'

  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-register'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JWTSecret
      Code:
        ZipFile: |
          'use strict';
          const {DynamoDBClient,PutItemCommand,GetItemCommand}=require('@aws-sdk/client-dynamodb');
          const c=require('crypto'),db=new DynamoDBClient({});
          const T=process.env.USERS_TABLE,S=process.env.JWT_SECRET;
          const H=(p,s)=>new Promise((ok,er)=>c.pbkdf2(p,s,100000,32,'sha256',(e,k)=>e?er(e):ok(k.toString('hex'))));
          const J=d=>{const h=Buffer.from(JSON.stringify({alg:'HS256',typ:'JWT'})).toString('base64url');const b=Buffer.from(JSON.stringify(d)).toString('base64url');return h+'.'+b+'.'+c.createHmac('sha256',S).update(h+'.'+b).digest('base64url');};
          const hd={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type','Content-Type':'application/json'};
          exports.handler=async ev=>{
          try{
          const{email,password}=JSON.parse(ev.body||'{}');
          if(!email||!password)return{statusCode:400,headers:hd,body:JSON.stringify({error:'Email and password required'})};
          if(password.length<8)return{statusCode:400,headers:hd,body:JSON.stringify({error:'Password must be at least 8 characters'})};
          const em=email.toLowerCase().trim();
          const ex=await db.send(new GetItemCommand({TableName:T,Key:{email:{S:em}}}));
          if(ex.Item)return{statusCode:409,headers:hd,body:JSON.stringify({error:'Account already exists'})};
          const salt=c.randomBytes(16).toString('hex'),hash=await H(password,salt),uid=c.randomUUID();
          await db.send(new PutItemCommand({TableName:T,Item:{email:{S:em},userId:{S:uid},passwordHash:{S:hash},salt:{S:salt},createdAt:{S:new Date().toISOString()}}}));
          return{statusCode:201,headers:hd,body:JSON.stringify({token:J({userId:uid,email:em,exp:Math.floor(Date.now()/1000)+2592000}),email:em})};
          }catch(e){return{statusCode:500,headers:hd,body:JSON.stringify({error:'Server error'})}}};

  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-login'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JWTSecret
      Code:
        ZipFile: |
          'use strict';
          const {DynamoDBClient,GetItemCommand}=require('@aws-sdk/client-dynamodb');
          const c=require('crypto'),db=new DynamoDBClient({});
          const T=process.env.USERS_TABLE,S=process.env.JWT_SECRET;
          const H=(p,s)=>new Promise((ok,er)=>c.pbkdf2(p,s,100000,32,'sha256',(e,k)=>e?er(e):ok(k.toString('hex'))));
          const J=d=>{const h=Buffer.from(JSON.stringify({alg:'HS256',typ:'JWT'})).toString('base64url');const b=Buffer.from(JSON.stringify(d)).toString('base64url');return h+'.'+b+'.'+c.createHmac('sha256',S).update(h+'.'+b).digest('base64url');};
          const hd={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type','Content-Type':'application/json'};
          exports.handler=async ev=>{
          try{
          const{email,password}=JSON.parse(ev.body||'{}');
          if(!email||!password)return{statusCode:400,headers:hd,body:JSON.stringify({error:'Email and password required'})};
          const em=email.toLowerCase().trim();
          const r=await db.send(new GetItemCommand({TableName:T,Key:{email:{S:em}}}));
          if(!r.Item)return{statusCode:401,headers:hd,body:JSON.stringify({error:'Invalid email or password'})};
          const hash=await H(password,r.Item.salt.S);
          if(hash!==r.Item.passwordHash.S)return{statusCode:401,headers:hd,body:JSON.stringify({error:'Invalid email or password'})};
          return{statusCode:200,headers:hd,body:JSON.stringify({token:J({userId:r.Item.userId.S,email:em,exp:Math.floor(Date.now()/1000)+2592000}),email:em})};
          }catch(e){return{statusCode:500,headers:hd,body:JSON.stringify({error:'Server error'})}}};

  SeedTrailsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-seed-trails'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      Environment:
        Variables:
          TRAILS_TABLE: !Ref TrailsTable
      Code:
        ZipFile: |
          'use strict';
          const{DynamoDBClient,BatchWriteItemCommand}=require('@aws-sdk/client-dynamodb');
          const{marshall}=require('@aws-sdk/util-dynamodb');
          const db=new DynamoDBClient({});
          const T=process.env.TRAILS_TABLE;
          exports.handler=async ev=>{
          const trails=ev.trails||[];
          if(!trails.length)return{error:'No trails provided'};
          for(let i=0;i<trails.length;i+=25){
          const reqs=trails.slice(i,i+25).map(t=>({PutRequest:{Item:marshall(t,{removeUndefinedValues:true})}}));
          await db.send(new BatchWriteItemCommand({RequestItems:{[T]:reqs}}));
          }
          return{seeded:trails.length};};

  SearchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-search'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      Environment:
        Variables:
          TRAILS_TABLE: !Ref TrailsTable
      Code:
        ZipFile: |
          'use strict';
          const{BedrockRuntimeClient,InvokeModelCommand}=require('@aws-sdk/client-bedrock-runtime');
          const{DynamoDBClient,ScanCommand}=require('@aws-sdk/client-dynamodb');
          const{unmarshall}=require('@aws-sdk/util-dynamodb');
          const cl=new BedrockRuntimeClient({region:process.env.AWS_REGION||'us-east-1'});
          const db=new DynamoDBClient({});
          const T=process.env.TRAILS_TABLE;
          const hd={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type','Content-Type':'application/json'};
          let cache=null;
          async function load(){if(cache)return cache;const r=await db.send(new ScanCommand({TableName:T}));return cache=(r.Items||[]).map(i=>unmarshall(i));}
          exports.handler=async ev=>{
          try{
          const q=((ev.queryStringParameters&&ev.queryStringParameters.q)||'').trim();
          if(!q)return{statusCode:400,headers:hd,body:JSON.stringify({error:'Query required'})};
          const trails=await load();
          const ql=q.toLowerCase(),ws=ql.split(/\s+/);
          const sc=t=>ws.filter(w=>[t.name,t.state,t.region,t.difficulty,t.terrain,t.highlights].some(f=>(f||'').toLowerCase().includes(w))).length;
          const sorted=trails.map(t=>({t,s:sc(t)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
          const cands=sorted.length>=2?sorted.slice(0,25).map(x=>x.t):trails.slice(0,25);
          const byId=Object.fromEntries(cands.map(t=>[t.id,t]));
          const ctx=cands.map(t=>`id:${t.id} name:"${t.name}" state:${t.state} difficulty:${t.difficulty} miles:${t.miles} days:${t.minDays}-${t.maxDays} terrain:${t.terrain} highlights:"${t.highlights||''}"`).join('\n');
          const prompt=`You are TrailPack, a backcountry hiking assistant. The user searched: "${q.slice(0,200)}"\nFrom our trail database:\n${ctx}\nSelect the 3-5 best matching trails. Respond ONLY with valid JSON:\n{"summary":"one sentence intro","results":[{"id":1,"description":"Why this trail matches the search."}]}`;
          const body=JSON.stringify({anthropic_version:'bedrock-2023-05-31',max_tokens:600,messages:[{role:'user',content:prompt}]});
          const resp=await cl.send(new InvokeModelCommand({modelId:'anthropic.claude-3-haiku-20240307-v1:0',contentType:'application/json',accept:'application/json',body:Buffer.from(body)}));
          const text=JSON.parse(Buffer.from(resp.body).toString()).content[0].text.trim();
          const s=text.indexOf('{'),e=text.lastIndexOf('}');
          let p;try{p=JSON.parse(s>=0?text.slice(s,e+1):text);}catch(_){p={summary:text,results:[]};}
          p.results=(p.results||[]).map(r=>{const t=byId[r.id];return t?{id:t.id,name:t.name,state:t.state,miles:t.miles,days:`${t.minDays}-${t.maxDays}`,difficulty:t.difficulty,description:r.description}:null;}).filter(Boolean);
          return{statusCode:200,headers:hd,body:JSON.stringify(p)};
          }catch(e){console.error(e);return{statusCode:500,headers:hd,body:JSON.stringify({error:'Search failed. Please try again.'})}}};

  AuthApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-auth-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 300

  AuthApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AuthApi
      StageName: prod
      AutoDeploy: true

  RegisterIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuthApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  LoginIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuthApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  RegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthApi
      RouteKey: 'POST /auth/register'
      Target: !Sub 'integrations/${RegisterIntegration}'

  LoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthApi
      RouteKey: 'POST /auth/login'
      Target: !Sub 'integrations/${LoginIntegration}'

  RegisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegisterFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApi}/*/*/auth/register'

  LoginLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApi}/*/*/auth/login'

  SearchIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuthApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  SearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthApi
      RouteKey: 'GET /search'
      Target: !Sub 'integrations/${SearchIntegration}'

  SearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SearchFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApi}/*/*/search'

Outputs:
  BucketName:
    Value: !Ref WebsiteBucket
    Description: S3 bucket name for website files

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront distribution ID (used for cache invalidations)

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront distribution domain name (point your DNS CNAME here)

  WebsiteURL:
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${CloudFrontDistribution.DomainName}'
    Description: Live website URL

  AuthApiEndpoint:
    Value: !Sub 'https://${AuthApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Description: Authentication API endpoint URL

  TrailsTableName:
    Value: !Ref TrailsTable
    Description: DynamoDB table name for trail catalog data
