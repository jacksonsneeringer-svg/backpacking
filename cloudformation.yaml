  TrailWeatherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-trail-weather'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 20
      Environment:
        Variables:
          TRAILS_TABLE: !Ref TrailsTable
      Code:
        ZipFile: |
          'use strict';
          const{BedrockRuntimeClient,InvokeModelCommand}=require('@aws-sdk/client-bedrock-runtime');
          const{DynamoDBClient,GetItemCommand}=require('@aws-sdk/client-dynamodb');
          const{unmarshall}=require('@aws-sdk/util-dynamodb');
          const cl=new BedrockRuntimeClient({region:process.env.AWS_REGION||'us-east-1'});
          const db=new DynamoDBClient({});
          const T=process.env.TRAILS_TABLE;
          const hd={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type','Content-Type':'application/json'};
          exports.handler=async ev=>{
          try{
          const qs=ev.queryStringParameters||{};
          const trailId=parseInt(qs.trailId||'0');
          const startDate=qs.startDate||'';
          const endDate=qs.endDate||'';
          if(!trailId||!startDate||!endDate)return{statusCode:400,headers:hd,body:JSON.stringify({error:'trailId, startDate, and endDate required'})};
          const result=await db.send(new GetItemCommand({TableName:T,Key:{id:{N:String(trailId)}}}));
          if(!result.Item)return{statusCode:404,headers:hd,body:JSON.stringify({error:'Trail not found'})};
          const trail=unmarshall(result.Item);
          const start=new Date(startDate);
          const end=new Date(endDate);
          const startMonth=start.toLocaleString('en-US',{month:'long',timeZone:'UTC'});
          const endMonth=end.toLocaleString('en-US',{month:'long',timeZone:'UTC'});
          const yr=start.getFullYear();
          const prompt=`You are a backcountry hiking expert. A hiker is planning a trip on the ${trail.name} (${trail.region}, ${trail.state}) from ${startDate} to ${endDate} (${startMonth}${startMonth!==endMonth?' to '+endMonth:''} ${yr}).\nTrail: ${trail.miles} miles, terrain: ${trail.terrain}, gain: ${trail.gain||'unknown'} ft, difficulty: ${trail.difficulty}.\nBased on typical weather for this trail/region during ${startMonth}${startMonth!==endMonth?' through '+endMonth:''}, what conditions should the hiker prepare for?\nRespond ONLY with valid JSON, no explanation: {"weather":["condition1"]}\nUse ONLY these exact values (include all that apply): "hot" (regularly above 75F/24C), "mild" (45-75F/7-24C pleasant), "cold" (below 45F/7C or strong wind chill), "wet" (frequent rain/precipitation), "snow" (snow or ice on trail possible).\nBe accurate to the specific region and season.`;
          const body=JSON.stringify({anthropic_version:'bedrock-2023-05-31',max_tokens:80,messages:[{role:'user',content:prompt}]});
          const resp=await cl.send(new InvokeModelCommand({modelId:'anthropic.claude-3-haiku-20240307-v1:0',contentType:'application/json',accept:'application/json',body:Buffer.from(body)}));
          const text=JSON.parse(Buffer.from(resp.body).toString()).content[0].text.trim();
          const s=text.indexOf('{'),e=text.lastIndexOf('}');
          let p;try{p=JSON.parse(s>=0?text.slice(s,e+1):text);}catch(_){p={weather:['mild']};}
          const valid=['hot','mild','cold','wet','snow'];
          const weather=(p.weather||['mild']).filter(w=>valid.includes(w));
          if(!weather.length)weather.push('mild');
          return{statusCode:200,headers:hd,body:JSON.stringify({weather,trail:{id:trail.id,name:trail.name,terrain:trail.terrain,difficulty:trail.difficulty}})};
          }catch(e){console.error(e);return{statusCode:500,headers:hd,body:JSON.stringify({error:'Weather lookup failed'})}}};

  WeatherIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuthApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TrailWeatherFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  WeatherRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthApi
      RouteKey: 'GET /trail/weather'
      Target: !Sub 'integrations/${WeatherIntegration}'

  WeatherLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TrailWeatherFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApi}/*/*/trail/weather'

Outputs:
  BucketName:
    Value: !Ref WebsiteBucket
    Description: S3 bucket name for website files

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront distribution ID (used for cache invalidations)

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront distribution domain name (point your DNS CNAME here)

  WebsiteURL:
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${CloudFrontDistribution.DomainName}'
    Description: Live website URL

  AuthApiEndpoint:
    Value: !Sub 'https://${AuthApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Description: Authentication API endpoint URL

  TrailsTableName:
    Value: !Ref TrailsTable
    Description: DynamoDB table name for trail catalog data

  FavoritesTableName:
    Value: !Ref FavoritesTable
    Description: DynamoDB table name for user favorites
