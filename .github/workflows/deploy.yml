name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: trailpack-website

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DomainName="${{ vars.DOMAIN_NAME || 'trailpack.snurray.com' }}" \
              AcmCertificateArn="${{ secrets.ACM_CERTIFICATE_ARN }}" \
              JWTSecret="${{ secrets.JWT_SECRET || 'trailpack-change-me-before-prod' }}" \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          AUTH_API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`AuthApiEndpoint`].OutputValue' \
            --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "auth_api_endpoint=$AUTH_API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Seed trail catalog to DynamoDB
        run: |
          jq '{trails: .}' trails.json > /tmp/seed-payload.json
          aws lambda invoke \
            --function-name ${{ env.STACK_NAME }}-seed-trails \
            --payload file:///tmp/seed-payload.json \
            --cli-binary-format raw-in-base64-out \
            /tmp/seed-response.json
          cat /tmp/seed-response.json

      - name: Generate API config
        run: |
          echo "var TRAILPACK_API_ENDPOINT = '${{ steps.stack.outputs.auth_api_endpoint }}';" > api-config.js

      - name: Sync website files to S3
        run: |
          # Non-HTML/config assets: long-lived immutable cache
          aws s3 sync . s3://${{ steps.stack.outputs.bucket }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "cloudformation.yaml" \
            --exclude "CNAME" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "api-config.js" \
            --cache-control "public, max-age=31536000, immutable"

          # HTML files: always revalidate
          aws s3 sync . s3://${{ steps.stack.outputs.bucket }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

          # API config: always revalidate (generated fresh each deploy)
          aws s3 cp api-config.js s3://${{ steps.stack.outputs.bucket }}/api-config.js \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.distribution_id }} \
            --paths "/*"
